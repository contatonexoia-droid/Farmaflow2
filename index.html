
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#3B82F6" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link id="manifest-link" rel="manifest" href="/manifest.json" />

    <!-- Metadados Padrão do Navegador -->
    <title>FarmaFlow - Farmácia e Perfumaria Online</title>
    <meta name="description" content="Faça seu pedido online com rapidez e comodidade. Medicamentos, perfumaria e cuidados diários com tele-entrega." />

    <!-- Metadados de Compartilhamento / WhatsApp / Facebook / Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FarmaFlow" />
    <meta property="og:url" content="https://farmaflow.online" />
    <meta property="og:title" content="FarmaFlow - Sua Drogaria e Perfumaria Online" />
    <meta property="og:description" content="Faça seu pedido online com rapidez e comodidade. Medicamentos, perfumaria e cuidados diários com tele-entrega direta no seu WhatsApp." />

    <!-- Imagem de Destaque (Thumbnail Quadrada para WhatsApp) -->
    <meta property="og:image" content="https://farmaflow.online/preview-share.png" />
    <meta property="og:image:secure_url" content="https://farmaflow.online/preview-share.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Logotipo FarmaFlow" />

    <!-- Twitter / X (Card no estilo resumo compacto lateral) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FarmaFlow - Sua Drogaria e Perfumaria Online" />
    <meta name="twitter:description" content="Faça seu pedido online com rapidez e comodidade. Medicamentos, perfumaria e cuidados diários com tele-entrega." />
    <meta name="twitter:image" content="https://farmaflow.online/preview-share.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://wsrv.nl">
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #fcfdfe;
        margin: 0;
      }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
    <script>
      (function() {
        try {
          var p = window.location.pathname || '';
          if (p.startsWith('/admin') || p.startsWith('/login')) {
            var ml = document.getElementById('manifest-link');
            if (ml) {
              ml.href = '/manifest.json?context=admin';
            }
          }
        } catch (e) {}
      })();
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
